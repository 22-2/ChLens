name: Release Please

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update release PR
        uses: googleapis/release-please-action@v5
        with:
          target-branch: develop
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
