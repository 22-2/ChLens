name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example, 3.3.0). Leave empty to choose interactively."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Configure release branch
        run: |
          git switch develop
          git branch --set-upstream-to=origin/develop develop

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release-it
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$RELEASE_VERSION" ]; then
            pnpm release --ci "$RELEASE_VERSION"
          else
            pnpm release --ci
          fi
