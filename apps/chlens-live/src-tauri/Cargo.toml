[package]
name = "chlens-live"
version = "0.1.0"
description = "Chlens Live Tauri shell"
authors = ["ChLens contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "chlens_live_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mouse_position = "0.1.3"
tauri = { version = "2.11.0", features = ["devtools"] }

[[bin]]
name = "chlens-live"
path = "src/main.rs"
