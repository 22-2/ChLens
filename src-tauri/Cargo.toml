[package]
name = "chlens"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "chlens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# releaseビルドでもDevToolsを開けるようにするため有効化
tauri = { version = "2.11.0", features = ["devtools"] }
tauri-plugin-log = "2"
# 書き込み先が要求するOriginを直接POSTへ設定するため、HTTPプラグインの安全な既定値による
# TauriアプリOriginの自動付与を上書きできるようにする。
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

[[bin]]
name = "chlens"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
